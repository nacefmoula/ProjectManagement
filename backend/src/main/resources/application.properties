spring.application.name=backend
spring.datasource.url=jdbc:mysql://localhost:3306/test_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Management & Observability (Prometheus & Health)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always

# SpringDoc OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.path=/v3/api-docs

# JWT Configuration
jwt.secret=ProductionGradeSecretKeyWithAtLeast256BitsLengthForHMACSHA256DevOpsAppGestionProjets2026
jwt.expiration-ms=86400000

# Default Security Accounts Passwords
app.security.default-admin-password=Admin123!
app.security.default-user-password=User123!

# CORS Configuration
app.cors.allowed-origins=http://localhost:4200,http://localhost:30080,http://localhost:8080,http://127.0.0.1:4200,http://127.0.0.1:30080,http://127.0.0.1:8080,http://192.168.49.2:30080,http://192.168.49.2:80,http://192.168.49.2
app.cors.allowed-origin-patterns=http://localhost*,http://127.0.0.1*,http://192.168.*