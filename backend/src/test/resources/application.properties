# Test Configuration - In-Memory H2 Database
spring.application.name=backend-test

# DataSource H2 in MySQL compatibility mode
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Actuator for tests
management.endpoints.web.exposure.include=health,info,prometheus

# CORS Configuration
app.cors.allowed-origins=http://localhost:4200,http://localhost:30080
app.cors.allowed-origin-patterns=http://localhost*,http://127.0.0.1*
